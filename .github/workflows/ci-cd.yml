name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - testing
      - feature/**
  pull_request:
    branches:
      - main
      - testing

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd packages/frontend && npm ci

      - name: Install backend dependencies
        run: cd packages/backend && npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Type checking
        run: npm run type-check
        continue-on-error: true

      - name: Run tests
        run: npm run test
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd packages/frontend && npm ci

      - name: Install backend dependencies
        run: cd packages/backend && npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist

  deploy-testing:
    name: Deploy to Testing Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/testing' || startsWith(github.ref, 'refs/heads/feature/')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && cd packages/backend && npm ci && cd ../frontend && npm ci

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist

      - name: Apply D1 migrations (Testing)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd packages/backend
          npx wrangler d1 migrations apply boardgames-testing --env testing --remote

      - name: Deploy backend to Cloudflare (Testing)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
          ENVIRONMENT: testing
        run: |
          cd packages/backend
          npx wrangler deploy --env testing

      - name: Sync optional Worker secrets (Testing)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd packages/backend
          for name in GOOGLE_MAPS_API_KEY TICKETMASTER_API_KEY ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "Setting $name"
              printf '%s' "$value" | npx wrangler secret put "$name" --env testing
            else
              echo "Skipping $name (no GitHub secret)"
            fi
          done

      - name: Build frontend (Testing)
        env:
          VITE_API_URL: https://boardgames-testing.sarkkarijobseva.workers.dev/api
        run: |
          cd packages/frontend
          npm run build

      - name: Deploy frontend to Cloudflare (Testing)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd packages/frontend
          npx wrangler deploy --env testing

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && cd packages/backend && npm ci && cd ../frontend && npm ci

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: packages/backend/dist

      - name: Apply D1 migrations (Production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd packages/backend
          npx wrangler d1 migrations apply boardgames-prod --env production --remote

      - name: Deploy backend to Cloudflare (Production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd packages/backend
          npx wrangler deploy --env production

      - name: Sync optional Worker secrets (Production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd packages/backend
          for name in GOOGLE_MAPS_API_KEY TICKETMASTER_API_KEY ANTHROPIC_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "Setting $name"
              printf '%s' "$value" | npx wrangler secret put "$name" --env production
            else
              echo "Skipping $name (no GitHub secret)"
            fi
          done

      - name: Build frontend (Production)
        env:
          VITE_API_URL: https://boardgames-prod.sarkkarijobseva.workers.dev/api
        run: |
          cd packages/frontend
          npm run build

      - name: Deploy frontend to Cloudflare (Production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_claude || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd packages/frontend
          npx wrangler deploy --env production
