name = "boardgames-workers"
main = "src/index.ts"
compatibility_date = "2024-09-06"
account_id = "05607df215f6fbb6d85e742ca0e6bc59"

# Environment Variables
env:
  production:
    name = "boardgames-prod"
    routes = [
      { pattern = "www.boardgamesepic.com/*", zone_name = "boardgamesepic.com" },
      { pattern = "boardgamesepic.com/*", zone_name = "boardgamesepic.com" }
    ]
    vars = { ENVIRONMENT = "production" }

  testing:
    name = "boardgames-testing"
    routes = [
      { pattern = "test.boardgamesepic.com/*", zone_name = "boardgamesepic.com" }
    ]
    vars = { ENVIRONMENT = "testing" }

# Database Bindings (D1)
[[d1_databases]]
binding = "DB"
database_name = "boardgames-prod"
database_id = "PLACEHOLDER_PROD_DB_ID"
preview_database_id = "PLACEHOLDER_PREVIEW_DB_ID"

# KV Namespaces (Caching)
[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_CACHE_KV_ID"
preview_id = "PLACEHOLDER_CACHE_PREVIEW_ID"

# R2 Bucket (Asset Storage)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "boardgames-assets"
preview_bucket_name = "boardgames-assets-preview"

# Durable Objects (Real-time Multiplayer)
[[durable_objects.bindings]]
name = "GAME_SESSION"
class_name = "GameSession"
script_name = "boardgames-workers"

# Build
build = { command = "npm run build", cwd = "." }

# Compatibility Flags
compatibility_flags = [
  "nodejs_compat",
  "streams_enable_constructors"
]

# Observability
observability = { enabled = true }

# Dev Server Config
[dev]
ip = "0.0.0.0"
port = 8787

# Limits
limits = { cpu_ms = 50 }
