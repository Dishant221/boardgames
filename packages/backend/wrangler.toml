name = "boardgames-workers"
main = "src/index.ts"
compatibility_date = "2024-09-06"
account_id = "05607df215f6fbb6d85e742ca0e6bc59"

# Production Environment
[env.production]
name = "boardgames-prod"
routes = [
  { pattern = "www.boardgamesepic.com/*", zone_name = "boardgamesepic.com" },
  { pattern = "boardgamesepic.com/*", zone_name = "boardgamesepic.com" }
]
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "boardgames-prod"
database_id = ""

[[env.production.kv_namespaces]]
binding = "CACHE"
id = ""
preview_id = ""

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "boardgames-assets"

[[env.production.durable_objects.bindings]]
name = "GAME_SESSION"
class_name = "GameSession"
script_name = "boardgames-prod"

# Testing/Staging Environment
[env.testing]
name = "boardgames-testing"
routes = [
  { pattern = "test.boardgamesepic.com/*", zone_name = "boardgamesepic.com" }
]
vars = { ENVIRONMENT = "testing" }

[[env.testing.d1_databases]]
binding = "DB"
database_name = "boardgames-testing"
database_id = ""

[[env.testing.kv_namespaces]]
binding = "CACHE"
id = ""
preview_id = ""

[[env.testing.r2_buckets]]
binding = "ASSETS"
bucket_name = "boardgames-assets-testing"

[[env.testing.durable_objects.bindings]]
name = "GAME_SESSION"
class_name = "GameSession"
script_name = "boardgames-testing"

# Development Environment
[env.development]
vars = { ENVIRONMENT = "development" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "boardgames-dev"
database_id = ""

[[env.development.kv_namespaces]]
binding = "CACHE"
id = ""
preview_id = ""

[[env.development.durable_objects.bindings]]
name = "GAME_SESSION"
class_name = "GameSession"
script_name = "boardgames-dev"

# Build
build = { command = "npm run build", cwd = "." }

# Compatibility Flags
compatibility_flags = [
  "nodejs_compat",
  "streams_enable_constructors"
]

# Observability
observability = { enabled = true }

# Dev Server Config
[dev]
ip = "0.0.0.0"
port = 8787

# Limits
limits = { cpu_ms = 50 }
